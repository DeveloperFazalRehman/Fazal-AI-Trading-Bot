name: Build Fazal AI Trading APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Complete Android Project
        run: |
          npm install
          npx cap add android

      - name: Generate Custom App Icons & Splash Screens
        run: |
          npx capacitor-assets generate --android

      - name: Inject Custom AndroidManifest & Background Service
        run: |
          cp android-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp android-native/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          mkdir -p android/app/src/main/java/com/fazal/tradingbot
          cp android-native/java/com/fazal/tradingbot/*.java android/app/src/main/java/com/fazal/tradingbot/
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fazal-AI-Trading-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
